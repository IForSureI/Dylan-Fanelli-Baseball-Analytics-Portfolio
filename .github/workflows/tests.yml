name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g playwright@1.49.1 && playwright install --with-deps chromium   # the browser checks in tests/
      - run: uv run pytest -q
