    pitchers' next-season line puts 2027 at .312 with a .029 spread, so P(.320 or lower) = 0.61, rounded to 0.60.
  resolves_by: 2027-10-15
  resolution: >-
    Baseball Savant wOBA allowed, 2027 regular season, all clubs combined. Fewer than 400 batters faced voids the
    call.
  outcome: null

- id: morejon-ch-whiff-50
  category: performance
  claim: >-
    Adrián Morejón's changeup gets whiffs on 50% or more of swings in 2027 (2026: 56.0% on 182 swings).
  probability: 0.40
  basis: >-
    The edge engine's next-season whiff projection (its 2026 projection table, data/edge/2026/projection.parquet;
    leave-one-out RMSE 4.6 points) has the pitch at 48.9%: its results beat its physics by 15 points in 2026, and
    about half of such a gap carries over. (The engine's row has 101 whiffs on 181 swings, one swing fewer than
    the 182 above because that pitch has no complete physics.) P(50% or more) = 0.41, rounded to 0.40. My
    scouting report on him (reports/2026-morejon-pro-scouting-report.md) calls the pitch's newness the biggest
    question in his profile.
  resolves_by: 2027-10-15
  resolution: >-
    Baseball Savant whiff% (whiffs per swing) on the pitch Statcast labels his changeup, 2027 regular season, all
    clubs combined; if Statcast relabels it a split-finger, that pitch. Fewer than 75 swings voids the call.
  outcome: null

- id: abreu-bb-11
  category: performance
  claim: >-
    Bryan Abreu's 2027 walk rate is 11.0% or lower (2026, Astros: 15.3%).
  probability: 0.40
  basis: >-
    The bullpen memo moves him into a closer's role only if his walk rate stays at or below about 11%, resting on a
    borderline second half (11.3%, p = 0.058). Weighting 2026/2025/2024 = 5/4/3 (15.3%, 10.5%, 9.8% unintentional
    walks per batter faced, Statcast) and regressing toward the 2026 relief average (9.1%) at the usual
    170-batter stabilization point gives 11.6%, with a 2.3-point spread over 260 batters, so P = 0.40
    (abreu_walk_rate() in baseball/predictions.py prints every step).
  resolves_by: 2027-10-15
  resolution: >-
    FanGraphs BB%, 2027 regular season, all clubs combined. Fewer than 40 innings voids the call.
  outcome: null

# ---------------------------------------------------------------- draft outcomes (2026 draftees)
# Grades and reads are my own (20 internal reports on 2026 draftees, Oct. 17; not published here). Minor
# league stats from FanGraphs, regular season. Rate calls are computed from FanGraphs' per-level lines summed
# over every level he plays: K% = strikeouts / PA, ISO = (total bases - hits) / AB, BB% = walks / batters faced.

- id: cholowsky-double-a
  category: draft outcome
  claim: >-
    Roch Cholowsky (SS, White Sox, No. 1 pick in 2026) plays at least one regular-season game at Double-A or higher in 2027.
  probability: 0.70
  basis: >-
    Top college bats usually reach Double-A in their first full season. I hold him a step under that: I grade the
    hit tool 55, with its play against wood as the open question (.218 in 65 Cape PA, .167 in 46 High-A PA),
    right wrist tendinitis ended his 2026 on Aug. 22, and the White Sox note he has never played a full season
    (MLB.com, Sept. 10, 2026). Judgment.
  resolves_by: 2027-10-15
  resolution: >-
    His MiLB.com or MLB.com game log for the 2027 regular season. Rehab games count.
  outcome: null

- id: flora-over-cholowsky
  category: draft outcome
  claim: >-
    Jackson Flora (RHP, Giants, No. 4 pick in 2026) ranks ahead of Roch Cholowsky on the last MLB Pipeline Top 100 published on or before Oct. 15, 2027.
  probability: 0.30
  basis: >-
    I rank Flora first of the 20 draftees I've graded (FV 55, OFP 60, the rarer asset) and Cholowsky second. MLB
    Pipeline had Cholowsky No. 11 and Flora No. 30 in September 2026 (MLB.com, Sept. 10 and 18). Closing a 19-spot
    gap takes a strong full season at Double-A, so this is a judgment on whether the industry comes around to my
    order.
  resolves_by: 2027-10-15
  resolution: >-
    MLB Pipeline's overall Top 100 on MLB.com, the last version published on or before Oct. 15, 2027. A player off
    the list ranks behind any listed player. If neither is listed, or either has lost prospect eligibility, the
    call is void.
  outcome: null

- id: burress-k-25
  category: draft outcome
  claim: >-
    Drew Burress (OF, Athletics, No. 8 pick in 2026) strikes out in 25.0% or more of his 2027 plate appearances.
  probability: 0.55
  basis: >-
    His pro debut at Single-A Stockton was loud (.291/.431/.591, 7 HR in 137 PA) but came with a 27.7% strikeout
    rate, and his 2024 Cape line with wood had 28.2%; in college, with metal, he struck out under 14%. The open
    question is whether the miss is chase or in-zone whiff, and I lean that the wood-bat strikeouts are real.
    Judgment.
  resolves_by: 2027-10-15
  resolution: >-
    FanGraphs K%, 2027 regular season, all minor and major league levels combined. Fewer than 250 PA voids the call.
  outcome: null

