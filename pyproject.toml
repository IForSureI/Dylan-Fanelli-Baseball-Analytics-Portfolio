[project]
name = "baseball"
version = "0.1.0"
description = "Dylan Fanelli's baseball operations workspace: data, evaluation, development, roster and business tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "pyarrow>=17",
    "pybaseball>=2.2.7",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
]

[project.scripts]
bb = "baseball.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baseball"]

[tool.pytest.ini_options]
testpaths = ["tests"]
