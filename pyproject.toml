[project]
name = "baseball"
version = "0.1.0"
description = "Baseball analytics workspace: Statcast pulls, arsenal tables, and analysis notebooks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyarrow>=17",
    "pybaseball>=2.2.7",
    "seaborn>=0.13",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baseball"]

[tool.pytest.ini_options]
testpaths = ["tests"]
