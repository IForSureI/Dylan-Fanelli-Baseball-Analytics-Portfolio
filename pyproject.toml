[project]
name = "baseball"
version = "0.1.0"
description = "Baseball operations workspace by Dylan Fanelli: data, evaluation, development, roster and business tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "adjustText>=1.0",
    "duckdb>=1.1",
    "joblib>=1.4",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "pillow>=10.4",
    "pyarrow>=17",
    "pybaseball>=2.2.7",
    "pyyaml>=6",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.scripts]
bb = "baseball.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
bayes = ["pymc>=6.3; python_version >= '3.12'", "arviz>=1.3; python_version >= '3.12'"]   # reports/bayes only; uv run --group bayes ...
video = [
    "opencv-python-headless>=4.10",
    "ultralytics>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baseball"]

[tool.pytest.ini_options]
testpaths = ["tests"]
