<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Edge Board, 2026: every pitch</title>
<meta name="description" content="A dashboard of every 2026 pitcher and pitch type with 50 or more tracked swings: whiff rate, expected whiff, results beyond stuff, the 2027 projection and 20-80 grades. Search, filter, sort. Dylan Fanelli.">
<style>
/* House look: the scorebook paper, black ink, stitch red and deep blue of the postseason page. Light only.
   One file: no outside fonts, scripts or images. Blue marks the field, red marks the pitcher the reader picked. */
:root {
  --paper: #f7f4ec; --plate: #fffdf8; --ink: #1a1a1a; --muted: #5b5a55; --soft: #8e8c85; --rule: #ddd8cc; --grid: #ebe7dd;
  --red: #c8392b; --red-ink: #a8301f; --blue: #285d9e; --tint: #efe9dc;
  --tip: #1a1a1a; --tip-ink: #f7f4ec; --tip-muted: #b5b2a9; --tip-rule: #3a3936;
  --display: "Be Vietnam Pro", "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --text: "Bricolage Grotesque", "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #f7f4ec; background: var(--paper); color: var(--ink); font: 400 17px/1.6 var(--text); overflow-x: hidden; }
table, .tiles b, svg text, .rlabel { font-variant-numeric: tabular-nums; }
a { color: var(--blue); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--red-ink); outline-offset: 2px; }
.col { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.wide { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

header.top { padding-top: 40px; padding-bottom: 6px; }
.crumbs { font-size: 15px; display: flex; gap: 18px; flex-wrap: wrap; margin: 0 0 32px; }
h1 { font: 800 clamp(32px, 6vw, 52px)/1.04 var(--display); margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 18px; margin: 0 0 16px; max-width: 60ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 22px; font-size: 14px; color: var(--muted); }
.tags span b { color: var(--ink); font-weight: 600; }

.read { background: var(--tint); padding: 18px 20px 8px; margin: 0 0 8px; }
.read h2 { font: 800 15px/1.2 var(--display); margin: 0 0 10px; color: var(--red-ink); }
.read h3 { font: 800 14px/1.2 var(--display); margin: 14px 0 8px; }
.read ul { margin: 0 0 12px; padding-left: 18px; font-size: 15.5px; line-height: 1.5; }
.read li { margin: 0 0 6px; }
.read li b { font-weight: 600; }

/* controls */
.filterbar { background: var(--paper); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-top: 26px; }
@media (min-width: 900px) { .filterbar { position: sticky; top: 0; z-index: 5; } }
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; padding-top: 12px; padding-bottom: 12px; font-size: 13px; }
.fgroup { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fgroup > label, .flabel { font-weight: 600; color: var(--muted); font-size: 12.5px; }
.fgroup input[type="search"], .fgroup select { font: 500 15px/1.2 var(--text); color: var(--ink); background: var(--plate); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 8px; height: 36px; min-width: 0; }
.fgroup input[type="search"] { width: 210px; }
.fgroup select { max-width: 190px; }
.seg { display: inline-flex; }
.seg button { font: 500 14px/1 var(--text); color: var(--ink); background: var(--plate); border: 1px solid var(--rule); padding: 0 11px; height: 36px; margin-left: -1px; cursor: pointer; border-radius: 0; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; } .seg button:last-child { border-radius: 0 6px 6px 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); position: relative; }
.slide { display: flex; align-items: center; gap: 8px; height: 36px; }
.slide input { width: 150px; accent-color: var(--blue); margin: 0; }
.rlabel { font-weight: 600; font-size: 14px; min-width: 2.6em; }
.check { flex-direction: row; align-items: center; gap: 6px; height: 36px; font-size: 14px; }
.check input { width: 16px; height: 16px; accent-color: var(--blue); margin: 0; }
.check label { color: var(--ink); font-weight: 500; font-size: 14px; }
.reset { font: 600 14px/1 var(--text); color: var(--blue); background: none; border: 0; padding: 0; height: 36px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.reset[hidden] { display: none; }

main { padding-bottom: 30px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 18px 0 6px; }
.tiles div { background: var(--plate); padding: 10px 12px; min-width: 0; }
.tiles b { display: block; font: 700 24px/1.15 var(--text); }
.tiles span { display: block; font-size: 13px; color: var(--muted); line-height: 1.3; }

.charts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 12px; }
figure { margin: 0; background: var(--plate); padding: 14px 12px 10px; min-width: 0; }
figure h2 { font: 800 16px/1.2 var(--display); margin: 0 0 2px; }
figure .sub { font-size: 13.5px; color: var(--muted); margin: 0 0 8px; line-height: 1.4; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--text); }
.axis text { font-size: 11px; fill: var(--muted); }
.axis-title { font-size: 12px; font-weight: 600; fill: var(--ink); }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--soft); stroke-width: 1; }
.diag { stroke: var(--soft); stroke-dasharray: 5 4; }
.corner { font-size: 11px; font-weight: 600; fill: var(--muted); }
.dot { fill: var(--blue); fill-opacity: .38; cursor: pointer; }
.dot:hover { fill-opacity: 1; stroke: var(--ink); stroke-width: 1.5; }
.has-sel .dot { fill-opacity: .2; }
.dot.sel, .has-sel .dot.sel { fill: var(--red); fill-opacity: 1; stroke: var(--ink); stroke-width: 1.5; }
.pt-label { font-size: 11px; font-weight: 700; fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--plate); stroke-width: 3px; stroke-linejoin: round; }
.bar { fill: var(--blue); fill-opacity: .55; }
.seltick { stroke: var(--red); stroke-width: 2; }
.empty { font-size: 14px; color: var(--muted); padding: 30px 8px; text-align: center; }

/* the pitcher a reader opened */
.pitcher { background: var(--plate); border: 1px solid var(--ink); padding: 16px 16px 12px; margin-top: 18px; scroll-margin-top: 90px; }
.pitcher.none { border-color: var(--rule); color: var(--muted); font-size: 15px; padding: 12px 16px; }
.p-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.p-head h2 { font: 800 clamp(22px, 3vw, 28px)/1.15 var(--display); margin: 0; }
.p-head .who { color: var(--muted); font-size: 15px; }
.p-head .acts { margin-left: auto; display: flex; gap: 14px; }
.linkbtn { font: 600 14px/1.2 var(--text); color: var(--blue); background: none; border: 0; padding: 4px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.p-line { font-size: 15px; margin: 6px 0 10px; }
.p-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.p-grid > div:first-child { max-width: 560px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin: 4px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend svg { width: 14px; height: 14px; display: inline-block; overflow: visible; }
.p-note { font-size: 14px; color: var(--muted); margin: 10px 0 0; }

/* tables */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--plate); }
table.grid { width: 100%; border-collapse: collapse; font-size: 14px; }
table.grid th { text-align: right; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--soft); padding: 0; white-space: nowrap; vertical-align: bottom; background: var(--plate); }
table.grid th.l, table.grid td.l { text-align: left; }
table.grid th button { font: 600 13px/1.25 var(--text); color: var(--muted); background: none; border: 0; padding: 8px 8px 6px; cursor: pointer; width: 100%; text-align: inherit; white-space: nowrap; }
table.grid th button:hover { color: var(--ink); }
table.grid th[aria-sort] button { color: var(--ink); }
table.grid th[aria-sort="ascending"] button::after { content: " \25B2"; font-size: 9px; }
table.grid th[aria-sort="descending"] button::after { content: " \25BC"; font-size: 9px; }
table.grid th.plain { padding: 8px 8px 6px; font-size: 13px; }
table.grid td { border-bottom: 1px solid var(--grid); padding: 6px 8px; text-align: right; white-space: nowrap; }
table.grid tbody tr { cursor: pointer; }
table.grid tbody tr:hover td { background: var(--tint); }
table.grid tbody tr.sel td { background: #f6e3de; }
table.grid td:first-child, table.grid th:first-child { position: sticky; left: 0; z-index: 1; background: var(--plate); }
table.grid tbody tr:hover td:first-child { background: var(--tint); }
table.grid tbody tr.sel td:first-child { background: #f6e3de; }
#arsenal table.grid tbody tr { cursor: default; }
#arsenal table.grid td, #arsenal table.grid th.plain { padding-left: 5px; padding-right: 5px; }
#arsenal table.grid { font-size: 13.5px; }
.who-btn { font: 600 14px/1.25 var(--text); color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.sub2 { color: var(--muted); font-size: 12.5px; font-weight: 400; }
.pos { color: var(--blue); } .neg { color: var(--red-ink); }
.clear { font-weight: 700; }
.grade { display: inline-block; min-width: 2.1em; text-align: center; padding: 0 4px; background: var(--tint); font-weight: 600; }
.grade.hi { background: var(--ink); color: var(--paper); }
.grade.lo { background: none; border: 1px solid var(--rule); color: var(--muted); }
.grade.unp { background: none; border: 1px dashed var(--soft); color: var(--muted); font-weight: 500; }
.dim { color: var(--soft); }
.tbl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin: 26px 0 8px; }
.tbl-head h2 { font: 800 clamp(20px, 3vw, 24px)/1.15 var(--display); margin: 0; }
.tbl-head .count { color: var(--muted); font-size: 15px; }
.tbl-head .acts { margin-left: auto; }
.more { display: flex; gap: 16px; align-items: center; padding: 12px 0 0; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.key { font-size: 14px; color: var(--muted); margin: 12px 0 0; }
.key b { color: var(--ink); font-weight: 600; }

footer { margin-top: 30px; border-top: 1px solid var(--rule); padding-top: 22px; padding-bottom: 48px; font-size: 15px; color: var(--muted); }
footer h2 { font: 800 15px/1.2 var(--display); color: var(--red-ink); margin: 0 0 8px; }
footer ul { padding-left: 18px; margin: 0; }
footer li { margin-bottom: 4px; }

#tip { position: fixed; z-index: 10; pointer-events: none; opacity: 0; width: min(280px, calc(100vw - 24px)); background: var(--tip); color: var(--tip-ink);
       padding: 10px 12px; border: 1px solid var(--tip-rule); font: 13px/1.4 var(--text); transition: opacity 100ms ease-out; }
#tip.on { opacity: 1; }
#tip b { font: 800 14px/1.2 var(--display); display: block; }
#tip .t-sub { color: var(--tip-muted); margin-bottom: 6px; display: block; }
#tip dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; }
#tip dt { color: var(--tip-muted); } #tip dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { #tip { transition: none; } }

@media (max-width: 900px) {
  .charts { grid-template-columns: minmax(0, 1fr); }
  .p-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  body { font-size: 16px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fgroup.grow { flex: 1 1 100%; }
  .fgroup.grow input[type="search"] { width: 100%; }
  .fgroup.half { flex: 1 1 calc(50% - 8px); }
  .fgroup.half select { max-width: none; width: 100%; }
  .slide input { width: 120px; }
  .read { padding: 14px 14px 4px; }
  .p-head .acts { margin-left: 0; width: 100%; }
  #tip { display: none; }
  .charts .axis text { font-size: 14px; } .charts .axis-title { font-size: 14px; } .charts .corner { font-size: 13px; } .charts .pt-label { font-size: 13.5px; }
}
</style>
</head>

const BIN = 2, G0 = -28, G1 = 28;

  box.innerHTML =
    "<div class=\"p-head\"><h2>" + esc(p.name) + "</h2><span class=\"who\">" + p.hand + "HP" + (p.team ? ", " + esc(p.team) : "") + "</span>" +
    "<span class=\"acts\"><button type=\"button\" class=\"linkbtn\" id=\"p-only\">Show only his rows</button><button type=\"button\" class=\"linkbtn\" id=\"p-close\">Close</button></span></div>" +
    "<p class=\"p-line\">" + mine.length + (mine.length === 1 ? " pitch" : " pitches") + " with " + M.min_swings + " or more tracked swings, " + num(sw_) + " swings in all. Whiff rate on them " + (100 * wh / sw_).toFixed(1) + "%, expected " + xw.toFixed(1) + "%, " + NEXT + " projection " + pj.toFixed(1) + "% (both weighted by swings).</p>" +
    "<div class=\"p-grid\"><div>" + strip(mine) + "</div><div id=\"arsenal\"><div class=\"scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Arsenal table, scrolls sideways on a small screen\"><table class=\"grid\"><thead><tr>" +
    cols.map(c => "<th scope=\"col\" class=\"plain" + (c[1] ? " l" : "") + "\">" + esc(c[0]) + "</th>").join("") + "</tr></thead><tbody>" +
    mine.map(d => "<tr><td class=\"l\"><b>" + esc(d.pitch) + "</b></td>" + (M.has_usage ? "<td>" + (d.usage == null ? "n/a" : f1(d.usage)) + "</td>" : "") +
      "<td>" + f1(d.velo) + "</td><td>" + sg(d.ivb) + "</td><td>" + sg(d.hb) + "</td><td>" + num(d.swings) + "</td><td>" + f1(d.whiff) + "</td><td>" + f1(d.lo) + " to " + f1(d.hi) + "</td><td>" + f1(d.x) + "</td>" +
      (M.has_location ? "<td>" + (d.xloc == null ? "n/a" : f1(d.xloc)) + "</td>" : "") + "<td>" + gapCell(d) + "</td><td>" + f1(d.proj) + "</td><td>" + (d.basis === 2 ? "2 seasons" : "1 season") + "</td>" +
      "<td>" + gradeCell(d.g_stuff, d.pt, true) + "</td><td>" + gradeCell(d.g_next, d.pt, false) + "</td></tr>").join("") +
    "</tbody></table></div><p class=\"p-note\">Velo in mph. IVB is induced vertical break and HB is horizontal break toward his arm side, both in inches. Only pitches with " + M.min_swings + " or more tracked swings are on the board, so a pitch he rarely throws is missing here." +
    (hasSweeper ? " His sweeper's stuff grade is unproven: read its actual whiff rate" + (M.has_location ? " and the location-aware number" : "") + "." : "") + "</p></div></div>";
  $("p-close").addEventListener("click", () => select(null));
  $("p-only").addEventListener("click", () => { Object.assign(S, DEFAULT, { q: p.name }); changed(); });
}
function select(id, scroll) {
  S.sel = id === S.sel && !scroll ? null : id;
  render();
  if (scroll && S.sel != null) {
    const box = $("pitcher"), top = box.getBoundingClientRect().top;
    if (top < 0 || top > window.innerHeight * 0.55) box.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }
}

/* ---------------------------------------------------------------- CSV of the rows on screen */
$("csv").addEventListener("click", () => {
  const head = ["pitcher_id", "pitcher", "throws", "club", "pitch_type", "pitch", "usage_pct", "swings", "whiffs", "whiff_pct", "whiff_lo", "whiff_hi", "expected_whiff_pct",
    "location_aware_expected_pct", "gap", "gap_clear", "proj_" + NEXT + "_whiff_pct", "proj_change", "proj_seasons", "stuff_grade", "grade_" + NEXT];
  const q = v => v == null ? "" : /[",\n]/.test(String(v)) ? "\"" + String(v).replace(/"/g, "\"\"") + "\"" : String(v);
  const lines = [head.join(",")].concat(sorted(visible()).map(r => [r.id, r.name, r.hand, r.team, r.pt, r.pitch, r.usage, r.swings, r.whiffs, r.whiff, r.lo, r.hi, r.x, r.xloc, r.gap, r.clear, r.proj, r.chg, r.basis, r.g_stuff, r.g_next].map(q).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv" }));
  a.download = "edge-board-" + M.season + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

function render() {
  const rows = visible();
  drawTiles(rows); drawScatter(rows); drawHist(rows); drawPitcher(); drawTable(rows);
}
syncControls(); render();
window.EDGE = { state: S, visible: visible, sorted: sorted, rows: ROWS };   // for checks from the console
})();
</script>
</body>
</html>
